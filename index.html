<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="Bepul testlar va darslarni yuklab oling." />
  <title>Bepul materiallar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1020;
      --ink: #f4f1ea;
      --muted: #a9b0c7;
      --gold: #f5c451;
      --coral: #ff7a59;
      --teal: #3ddbc1;
      --violet: #8b7bff;
      --card: rgba(255, 255, 255, 0.06);
      --stroke: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Manrope", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }

    /* ---------- Background ---------- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.55;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .blob.b1 { width: 46vmax; height: 46vmax; background: var(--violet); top: -18vmax; left: -14vmax; }
    .blob.b2 { width: 38vmax; height: 38vmax; background: var(--coral); bottom: -16vmax; right: -12vmax; animation-delay: -6s; }
    .blob.b3 { width: 26vmax; height: 26vmax; background: var(--teal); top: 40%; left: 55%; opacity: 0.3; animation-delay: -11s; }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(6vmax, 4vmax) scale(1.12); }
      100% { transform: translate(-4vmax, 7vmax) scale(0.95); }
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    }

    /* floating symbols */
    .float {
      position: absolute;
      font-family: "Unbounded", sans-serif;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.07);
      user-select: none;
      animation: bob 9s ease-in-out infinite;
    }
    .f1 { top: 12%; left: 8%;  font-size: clamp(48px, 9vw, 120px); }
    .f2 { top: 68%; left: 6%;  font-size: clamp(40px, 7vw, 96px);  animation-delay: -3s; }
    .f3 { top: 16%; right: 8%; font-size: clamp(44px, 8vw, 110px); animation-delay: -5s; }
    .f4 { bottom: 10%; right: 12%; font-size: clamp(36px, 6vw, 84px); animation-delay: -7s; }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50%      { transform: translateY(-18px) rotate(6deg); }
    }

    /* ---------- Content ---------- */
    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--stroke);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
      animation: rise 0.7s ease both;
    }
    .badge .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 0 rgba(61, 219, 193, 0.7);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(61, 219, 193, 0.6); }
      70%  { box-shadow: 0 0 0 10px rgba(61, 219, 193, 0); }
      100% { box-shadow: 0 0 0 0 rgba(61, 219, 193, 0); }
    }

    h1 {
      font-family: "Unbounded", sans-serif;
      font-weight: 800;
      font-size: clamp(30px, 7.5vw, 52px);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin: 22px 0 14px;
      animation: rise 0.7s 0.08s ease both;
    }
    h1 .hl {
      background: linear-gradient(100deg, var(--gold), var(--coral) 55%, var(--violet));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .sub {
      color: var(--muted);
      font-size: clamp(15px, 3.8vw, 17px);
      line-height: 1.55;
      max-width: 420px;
      margin: 0 auto 36px;
      animation: rise 0.7s 0.16s ease both;
    }

    .actions {
      display: grid;
      gap: 16px;
    }

    .btn {
      --accent: var(--gold);
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 18px 20px;
      border-radius: 22px;
      text-decoration: none;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--stroke);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      text-align: left;
      overflow: hidden;
      isolation: isolate;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      animation: rise 0.7s ease both;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:nth-child(1) { animation-delay: 0.26s; }
    .btn:nth-child(2) { animation-delay: 0.36s; --accent: var(--teal); }

    /* sliding fill on hover */
    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(110deg, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%);
      transform: translateX(-101%);
      transition: transform 0.45s cubic-bezier(.2,.8,.2,1);
    }
    /* shine sweep */
    .btn::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      width: 40%;
      left: -60%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,0.18), transparent);
      transform: skewX(-20deg);
      animation: shine 4.5s ease-in-out infinite;
    }
    .btn:nth-child(2)::after { animation-delay: 2.2s; }
    @keyframes shine {
      0%, 70% { left: -60%; }
      100%    { left: 130%; }
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--accent) 60%, transparent);
      box-shadow: 0 18px 40px -18px color-mix(in srgb, var(--accent) 70%, transparent);
    }
    .btn:hover::before,
    .btn:focus-visible::before { transform: translateX(0); }
    .btn:active { transform: translateY(0) scale(0.985); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .icon {
      flex: none;
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: var(--accent);
      color: #141826;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15);
    }
    .icon svg { width: 26px; height: 26px; }

    .label { flex: 1; min-width: 0; }
    .label strong {
      display: block;
      font-size: clamp(16px, 4.2vw, 18px);
      font-weight: 700;
      line-height: 1.25;
    }
    .label span {
      display: block;
      margin-top: 3px;
      font-size: 13px;
      color: var(--muted);
    }

    .arrow {
      flex: none;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--stroke);
      transition: transform 0.3s ease, background 0.3s ease, color 0.3s ease;
    }
    .arrow svg { width: 18px; height: 18px; }
    .btn:hover .arrow,
    .btn:focus-visible .arrow {
      background: var(--accent);
      color: #141826;
      transform: translateY(2px);
    }

    footer {
      margin-top: 40px;
      font-size: 12.5px;
      color: rgba(169, 176, 199, 0.7);
      animation: rise 0.7s 0.5s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* tiny phones */
    @media (max-width: 360px) {
      .btn { padding: 14px 14px; gap: 12px; border-radius: 18px; }
      .icon { width: 46px; height: 46px; border-radius: 14px; }
      .arrow { width: 32px; height: 32px; }
    }

    /* tablets / desktop: side-by-side cards */
    @media (min-width: 820px) {
      main { max-width: 820px; }
      .actions { grid-template-columns: 1fr 1fr; gap: 20px; }
      .btn {
        flex-direction: column;
        align-items: flex-start;
        padding: 28px;
        min-height: 220px;
        border-radius: 28px;
      }
      .icon { width: 64px; height: 64px; border-radius: 18px; }
      .icon svg { width: 30px; height: 30px; }
      .label strong { font-size: 21px; }
      .label span { font-size: 14px; margin-top: 6px; }
      .arrow { position: absolute; top: 28px; right: 28px; }
    }

    /* landscape phones: keep it compact */
    @media (max-height: 500px) and (orientation: landscape) {
      h1 { margin: 12px 0 8px; }
      .sub { margin-bottom: 20px; }
      .actions { grid-template-columns: 1fr 1fr; }
      footer { margin-top: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="grid"></div>
    <span class="float f1">A+</span>
    <span class="float f2">?</span>
    <span class="float f3">✓</span>
    <span class="float f4">Aa</span>
  </div>

  <main>
    <div class="badge"><span class="dot"></span> 100% bepul</div>

    <h1>Bilimingizni <span class="hl">bugundan</span> boshlang</h1>

    <p class="sub">Testlar va darslarni bir bosishda yuklab oling — ro‘yxatdan o‘tish shart emas.</p>

    <div class="actions">
      <!-- TODO: replace href="#" with the real download links -->
      <a class="btn" href="#" id="tests-link">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
        </span>
        <span class="label">
          <strong>Bepul testlarni yuklab olish</strong>
          <span>Mashq qiling va natijangizni tekshiring</span>
        </span>
        <span class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12l7 7 7-7"/>
          </svg>
        </span>
      </a>

      <a class="btn" href="#" id="lessons-link">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/>
            <path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>
          </svg>
        </span>
        <span class="label">
          <strong>Bepul darslarni yuklab olish</strong>
          <span>Mavzular bo‘yicha tushunarli darslar</span>
        </span>
        <span class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12l7 7 7-7"/>
          </svg>
        </span>
      </a>
    </div>

    <footer>© <span id="year"></span> · Barcha materiallar bepul</footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
